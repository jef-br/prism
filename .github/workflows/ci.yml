name: CI

# Build + unit tests + web typecheck + a fast match-only pipeline smoke on the committed CiMini
# fixture. Runs on the self-hosted Windows runner (it holds the CLIP model via PRISM_ONNX_MODEL_DIR
# and the .NET 9/10 SDKs + Node — see test/ci/README.md).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v5

      - name: Build solution (Release)
        shell: pwsh
        run: dotnet build jb/src/PRISM.sln -c Release --nologo

      - name: Unit tests (xUnit)
        shell: pwsh
        # Runs every test project in the solution (Prism.Core.Tests + one project per public
        # service — Matching/Generate/Transform/Upscale — plus the Prism.Tests.Shared fixture
        # library). Includes PipelineIntegrationTests, which shares its pipeline runs via
        # PipelineFixture, so the suite completes in ~6 min rather than ~30.
        # No LogFileName override: five test projects share one results directory, and a fixed name
        # would make them overwrite each other's trx. Default naming is unique per project+run.
        # -m:1 serializes the test projects: run in parallel they contend for the GPU (CLIP + pipeline
        # + Real-ESRGAN at once) and the ServiceHost suite flakes with in-memory HTTP aborts (see
        # jbtodo.md R8).
        run: >
          dotnet test jb/src/PRISM.sln
          -c Release --no-build -m:1
          --logger trx
          --results-directory ${{ github.workspace }}/test-results

      - name: Web typecheck + build
        shell: pwsh
        working-directory: jb/src/workbench/web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Match-only pipeline smoke (CiMini)
        shell: pwsh
        run: pwsh test/ci/Invoke-CiPipeline.ps1 -Mode Match -Dataset CiMini

      - name: Upload test + CI artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ci-artifacts
          path: |
            test-results/**/*.trx
            matching-testlogs.txt
          if-no-files-found: ignore
