name: CI

# Build + unit tests + web typecheck + a fast match-only pipeline smoke on the committed CiMini
# fixture. Runs on the self-hosted Windows runner (it holds the CLIP model via PRISM_ONNX_MODEL_DIR
# and the .NET 9/10 SDKs + Node — see test/ci/README.md).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v5

      - name: Locate the CI asset store
        shell: pwsh
        # SPACINI29 (487 MB) is gitignored, so a checkout never contains it — it lives in the runner
        # user's asset store beside the ONNX models. Defaulted here rather than read from a machine
        # variable so an interactively-launched runner picks it up without being restarted; an
        # explicitly-set PRISM_DATASET_DIR still wins. See test/ci/README.md.
        run: |
          if (-not $env:PRISM_DATASET_DIR) {
            "PRISM_DATASET_DIR=$env:USERPROFILE\prism-ci-assets\datasets" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          Write-Host "PRISM_DATASET_DIR = $env:PRISM_DATASET_DIR"

      - name: Build solution (Release)
        shell: pwsh

        run: dotnet build jb/src/PRISM.sln -c Release --nologo -warnaserror:SA1402,SA1649,S109,SA1101

      - name: Enforce K&R brace style
        shell: pwsh
        # .editorconfig sets csharp_new_line_before_open_brace = none, encoding the house K&R
        # rule (PRISM CLAUDE.md: opening braces on the same line as the declaration/statement).
        # SA1500 (Allman) = permanently suppressed. Roslyn whitespace formatter = gate (not an analyzer warning)
        # --verify-no-changes fails the step (non-zero exit) instead of rewriting files.
        run: dotnet format whitespace jb/src/PRISM.sln --verify-no-changes

      - name: Unit tests (xUnit)
        shell: pwsh
        # Runs every test project in the solution (Prism.Core.Tests + one project per public
        # service — Matching/Generate/Transform/Upscale — plus the Prism.Tests.Shared fixture
        # library). Includes PipelineIntegrationTests, which shares its pipeline runs via
        # PipelineFixture, so the suite completes in ~6 min rather than ~30.
        # No LogFileName override: five test projects share one results directory, and a fixed name
        # would make them overwrite each other's trx. Default naming is unique per project+run.
        # -m:1 serializes the test projects: run in parallel they contend for the GPU (CLIP + pipeline
        # + Real-ESRGAN at once) and the ServiceHost suite flakes with in-memory HTTP aborts (see
        # jbtodo.md R8).
        run: >
          dotnet test jb/src/PRISM.sln
          -c Release --no-build -m:1
          --logger trx
          --results-directory ${{ github.workspace }}/test-results

      - name: Assert minimum test count
        shell: pwsh
        # T-4942: a crashed or short-circuited run still prints "Passed! - Failed: 0, Passed: 176",
        # which reads as success unless someone notices the count is short. Green is not enough — the
        # run also has to have executed roughly the suite we expect. The floor sits deliberately below
        # the current total so adding tests never breaks CI, but losing a whole project does.
        run: |
          $floor = 500
          $trx = Get-ChildItem "${{ github.workspace }}/test-results" -Filter *.trx -Recurse
          if (-not $trx) { throw "No .trx files produced - the test step did not run." }
          $total = 0
          foreach ($f in $trx) {
            $counters = ([xml](Get-Content $f.FullName)).TestRun.ResultSummary.Counters
            $total += [int]$counters.total
          }
          Write-Host "Executed $total tests across $($trx.Count) project(s); floor is $floor."
          if ($total -lt $floor) {
            throw "Only $total tests executed, expected at least $floor. A test project likely crashed or was skipped."
          }

      - name: Web typecheck + build
        shell: pwsh
        working-directory: jb/src/workbench/web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Match-only pipeline smoke (CiMini)
        shell: pwsh
        run: pwsh test/ci/Invoke-CiPipeline.ps1 -Mode Match -Dataset CiMini

      - name: Upload test + CI artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ci-artifacts
          path: |
            test-results/**/*.trx
            matching-testlogs.txt
          if-no-files-found: ignore
